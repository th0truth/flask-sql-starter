{% extends "base.html" %}

{% block content %}
    <h1>Users List</h1>

    {% if users %}
        <ul>
            {% for user in users %}
                <li>ID: {{ user.id }} - Username: {{ user.username }} - Email: {{ user.email }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No users registered yet.</p>
    {% endif %}
{% endblock %}
